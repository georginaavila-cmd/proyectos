<title>Intranet Wakanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Lato:wght@400;700;900&display=swap">
<style>
/* Mismo lenguaje visual que KAM 360 y Wakanda Documentos: fondo azul muy claro, barra blanca con logo y filete turquesa,
   titulares Lato 900 azul noche con palabra en turquesa, tarjetas blancas con ícono en cuadro turquesa suave. Solo tema claro, por marca. */
:root {
  color-scheme: light;
  --navy: #1f3f63; --blue: #3b6ca7; --blue-100: #e8eef6; --blue-050: #f4f7fb; --blue-200: #c3d3e6;
  --teal: #00a8a8; --teal-700: #008b8b; --teal-100: #d9f2f2; --teal-050: #eefafa;
  --pink: #ecb2c0; --pink-100: #fbeef1; --sand: #e7e38a; --sand-100: #faf9e4;
  --bg: #f2f6fb; --card: #ffffff;
  --ink: #222222; --ink-2: #555f6d; --ink-3: #8a94a3;
  --line: #e3e9f1;
  --ok: #1e8f52; --ok-bg: #eafaf1; --warn: #b26a00; --warn-bg: #fdf3e3; --bad: #c0392b; --bad-bg: #fdeceb; --info: #2f7fbf; --info-bg: #eaf4fc;
  --shadow: 0 4px 12px rgba(59,108,167,.10);
  --f-display: "Lato", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Jost", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; color: var(--navy); font-weight: 900; }
h1 em, h2 em { font-style: normal; color: var(--teal-700); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(0,168,168,.35); border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--teal-700); }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }

/* Barra de prototipo */
.proto { background: var(--sand-100); border-bottom: 1px solid #ecebc4; font-size: 13px; color: var(--ink-2); }
.proto .wrap { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; padding-block: 6px; }
.proto input[type=time] { border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; background: #fff; font-size: 13px; }
.seg { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: none; padding: 2px 12px; border-radius: 999px; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--blue-100); color: var(--blue); font-weight: 600; }

/* Barra superior */
.top { background: #fff; border-bottom: 3px solid var(--teal); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 92px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 76px; height: 76px; object-fit: contain; }
.brand span { font-family: var(--f-display); font-weight: 900; font-size: 22px; color: var(--navy); white-space: nowrap; }
.tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; padding-block: 4px; }
.tabs button { border: 0; background: none; padding: 8px 12px; border-radius: 999px; color: var(--ink-2); font-weight: 500; white-space: nowrap; font-size: 15px; }
.tabs button:hover { color: var(--navy); }
.tabs button[aria-current="page"] { background: var(--blue-100); color: var(--blue); font-weight: 600; }
.tag { font-family: var(--f-display); font-size: 11px; letter-spacing: .2em; font-weight: 700; color: var(--ink-2); text-transform: uppercase; }
.me { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; font-family: var(--f-display); font-weight: 900; font-size: 13px; flex: none; }
.avatar.soft { background: var(--teal-050); color: var(--navy); }
.me-txt { line-height: 1.25; text-align: right; display: none; }
.me-txt b { color: var(--navy); }
.me-txt span { color: var(--ink-3); font-size: 12px; }

main { padding-block: 40px 64px; }
.hello { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 32px; }
.hello h1 { font-size: clamp(32px, 4.4vw, 46px); line-height: 1.12; letter-spacing: -.02em; margin-top: 10px; }
.hello p { margin: 12px 0 0; color: var(--ink-2); font-size: 17px; max-width: 62ch; }
.grid-home { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.col { display: grid; gap: 28px; min-width: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.sec-h h2 { font-size: 24px; }
.link { border: 0; background: none; padding: 0; font-family: var(--f-display); font-weight: 700; color: var(--blue); font-size: 15px; }
.link:hover { color: var(--teal-700); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }

/* Pase de jornada */
.pass { display: grid; grid-template-columns: 240px minmax(0, 1fr); position: relative; overflow: hidden; box-shadow: var(--shadow); }
.stub { background: var(--blue-050); padding: 24px 22px 24px 28px; position: relative; display: flex; flex-direction: column; gap: 14px; border-right: 2px dashed var(--blue-200); }
.stub::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--teal); }
.stub .who { font-family: var(--f-display); font-weight: 900; font-size: 21px; line-height: 1.2; color: var(--navy); }
.stub dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
.stub dt { color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; padding-top: 2px; font-family: var(--f-display); font-weight: 700; }
.stub dd { margin: 0; font-weight: 600; color: var(--navy); }
.clock { font-family: var(--f-display); font-weight: 900; font-size: 42px; letter-spacing: -.02em; line-height: 1; margin-top: auto; color: var(--navy); }
.clock small { font-size: 17px; color: var(--teal-700); margin-left: 2px; }
.pass-body { padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.legs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); position: relative; }
.legs::before { content: ""; position: absolute; left: 12%; right: 12%; top: 21px; border-top: 2px dashed var(--blue-200); }
.leg { display: grid; justify-items: center; gap: 3px; text-align: center; position: relative; padding-inline: 4px; align-content: start; }
.leg .dot { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); color: var(--ink-3); position: relative; z-index: 1; }
.leg.done .dot { background: var(--teal); border-color: var(--teal); color: #fff; }
.leg.next .dot { background: var(--teal-050); border-color: var(--teal); color: var(--teal-700); box-shadow: 0 0 0 4px var(--teal-100); }
.leg .code { font-family: var(--f-display); font-weight: 900; letter-spacing: .12em; font-size: 12px; margin-top: 6px; color: var(--navy); }
.leg .lbl { font-size: 13px; color: var(--ink-2); line-height: 1.3; }
.leg .real { font-family: var(--f-display); font-weight: 900; font-size: 22px; line-height: 1.15; color: var(--navy); margin-top: 4px; }
.leg .plan { font-size: 12px; color: var(--ink-3); }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip .ico { width: 14px; height: 14px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.info { background: var(--info-bg); color: var(--info); }
.chip.mute { background: var(--blue-050); color: var(--ink-2); border: 1px solid var(--line); }
.action { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.mark-btn { font-family: var(--f-display); font-weight: 900; font-size: 17px; padding: 14px 26px; border-radius: 10px; background: var(--teal); color: #fff; border: 0; display: inline-flex; gap: 10px; align-items: center; box-shadow: 0 6px 16px rgba(0,168,168,.25); transition: transform .12s ease, background .12s; }
.mark-btn:hover { background: var(--teal-700); transform: translateY(-1px); }
.where { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.where .ico { color: var(--teal-700); width: 16px; height: 16px; }

/* Herramientas, igual que las tarjetas de Wakanda Documentos */
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
a.tool { text-decoration: none; color: inherit; }
.tool { text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 22px 22px 16px; display: flex; flex-direction: column; gap: 10px; transition: box-shadow .2s, border-color .2s; }
.tool:hover { box-shadow: var(--shadow); border-color: var(--blue-200); }
.sq { width: 46px; height: 46px; border-radius: 8px; display: grid; place-items: center; background: var(--teal-050); color: var(--teal-700); flex: none; }
.tool h3 { font-size: 20px; margin-top: 8px; }
.tool p { margin: 0; font-size: 15px; color: var(--ink-2); line-height: 1.5; flex: 1; }
.tool .foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 8px; font-size: 14px; color: var(--ink-2); }
.tool .foot .ico { width: 18px; height: 18px; color: var(--blue); }
.tool.add { border-style: dashed; background: transparent; }
.tool.add .sq { background: #fff; border: 1px dashed var(--blue-200); color: var(--blue); }

/* Comunicados */
.news { display: grid; gap: 12px; }
.note { padding: 16px 18px; display: grid; gap: 6px; }
.note.pin { border-left: 4px solid var(--pink); }
.note-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); }
.note h3 { font-size: 17px; }
.note p { margin: 0; font-size: 15px; color: var(--ink-2); }
.note-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.bar { height: 6px; border-radius: 999px; background: var(--blue-100); overflow: hidden; flex: 1; min-width: 80px; }
.bar span { display: block; height: 100%; background: var(--teal); }

/* Semana */
.week { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 14px; }
.day { border-radius: 8px; padding: 8px 2px; text-align: center; display: grid; gap: 4px; font-size: 12px; justify-items: center; }
.day b { font-family: var(--f-display); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.day.today { background: var(--blue-050); outline: 1px solid var(--blue-200); }
.day.today b { color: var(--blue); }

/* Turnos */
.t-M { background: var(--blue-100); color: var(--blue); }
.t-T { background: var(--teal-100); color: var(--teal-700); }
.t-S { background: var(--sand-100); color: #7d7100; }
.t-D { background: #f3f5f8; color: var(--ink-3); }
.t-V { background: var(--pink-100); color: #b04a66; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }

/* Tablas */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; white-space: nowrap; }
thead th { font-family: var(--f-display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; background: #fafcfe; }
th.today, td.today { background: var(--blue-050); }
th.today { color: var(--blue); }
tbody tr:last-child td { border-bottom: 0; }
.person { display: flex; gap: 10px; align-items: center; }
.person .avatar { width: 32px; height: 32px; font-size: 11px; }
.person b { color: var(--navy); font-weight: 600; }
.person small { display: block; color: var(--ink-3); font-size: 12px; }
.shift { border: 0; border-radius: 8px; padding: 6px 4px; font-weight: 600; font-size: 13px; width: 100%; min-width: 96px; text-align: center; display: inline-flex; justify-content: center; }
select.shift { appearance: none; -webkit-appearance: none; cursor: pointer; text-align-last: center; }
select.shift:hover { box-shadow: inset 0 0 0 2px var(--blue-200); }
.log { display: grid; gap: 8px; font-size: 14px; padding: 16px 18px; }
.log div { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.log time { color: var(--teal-700); font-size: 13px; font-weight: 600; min-width: 72px; }

/* Editor de turnos */
.notice { display: flex; gap: 12px; align-items: flex-start; background: var(--sand-100); border: 1px solid #ecebc4; border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; color: var(--ink); font-size: 14px; }
.notice .ico { color: #8a7d00; margin-top: 2px; }
.notice b { color: var(--navy); }
.turnos input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #fff; font-variant-numeric: tabular-nums; }
.turnos input:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px rgba(0,168,168,.2); }
.turnos .tname { width: 140px; font-weight: 600; color: var(--navy); }

/* Buscador */
.search { position: relative; flex: 0 1 230px; min-width: 170px; }
.search input { width: 100%; padding: 9px 12px 9px 36px; border: 1px solid var(--line); border-radius: 999px; background: var(--blue-050); font-size: 14px; }
.search input:focus { outline: none; border-color: var(--teal); background: #fff; box-shadow: 0 0 0 3px rgba(0,168,168,.2); }
.search > .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-3); pointer-events: none; }
.qres { position: absolute; top: calc(100% + 6px); right: 0; width: min(420px, calc(100vw - 32px)); background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px rgba(59,108,167,.16); padding: 8px; z-index: 30; max-height: 70vh; overflow-y: auto; }
.qres h4 { margin: 8px 8px 4px; font-family: var(--f-display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.qres .r { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 8px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.qres .r:hover, .qres .r:focus-visible { background: var(--blue-050); }
.qres .r b { color: var(--navy); font-weight: 600; display: block; font-size: 14px; }
.qres .r small { color: var(--ink-3); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qres .r > span:last-child { min-width: 0; }
.qres .sq { width: 34px; height: 34px; }
.qres .sq .ico { width: 16px; height: 16px; }
.qres .empty { padding: 14px 8px; color: var(--ink-3); font-size: 14px; }
mark { background: var(--sand); color: inherit; border-radius: 3px; padding: 0 1px; }
.hl { box-shadow: 0 0 0 3px var(--teal) !important; }
tr.hl td { background: var(--teal-050); }

/* Imágenes de comunicados */
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.thumb { border: 1px solid var(--line); padding: 0; border-radius: 8px; overflow: hidden; background: var(--blue-050); width: 120px; height: 84px; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:hover { border-color: var(--teal); }
.thumb.sm { width: 64px; height: 46px; }
.thumb .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(31,63,99,.8); color: #fff; display: grid; place-items: center; font-size: 13px; line-height: 1; }
.imgcount { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--ink-2); }
.imgcount .ico { width: 14px; height: 14px; }
.drop { border: 1px dashed var(--blue-200); border-radius: 8px; padding: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--blue-050); font-size: 14px; color: var(--ink-2); }
.drop label.btn { cursor: pointer; }
.drop input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.lightbox { position: fixed; inset: 0; background: rgba(15,30,48,.82); z-index: 60; display: grid; grid-template-rows: auto 1fr auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); gap: 12px; }
.lightbox .lb-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #fff; max-width: 1100px; width: 100%; margin: 0 auto; }
.lightbox .lb-top b { font-family: var(--f-display); font-size: 16px; }
.lightbox .lb-img { display: grid; place-items: center; min-height: 0; }
.lightbox .lb-img img { max-width: min(1100px, 100%); max-height: 100%; border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.4); background: #fff; }
.lightbox .lb-nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.lightbox .btn.ghost { background: rgba(255,255,255,.95); }

/* Informes */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 22px; }
.filters .field { gap: 4px; }
.filters .field label { font-size: 12px; color: var(--ink-3); font-family: var(--f-display); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.filters select { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; min-width: 150px; }
.kpis.six { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.kpis.six .kpi b, .kpis.six .kpi span { display: block; }
.kpis.six .kpi b { margin-bottom: 2px; }
.kpi small { display: block; font-size: 12px; color: var(--ink-3); }
.grid-rep { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; margin-bottom: 28px; }
.chartbox { padding: 18px 18px 10px; position: relative; }
.chartbox h3, .rankbox h3 { font-size: 17px; }
.chartbox .sub, .rankbox .sub { font-size: 13px; color: var(--ink-3); margin: 2px 0 10px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart text { font-family: var(--f-body); font-size: 11px; fill: var(--ink-3); }
.chart .bar { fill: var(--blue); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit:hover + .bar, .chart g.on .bar { fill: var(--navy); }
.tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 20px rgba(59,108,167,.16); padding: 8px 10px; font-size: 13px; color: var(--ink); max-width: 240px; z-index: 5; }
.tip b { color: var(--navy); font-family: var(--f-display); }
.rankbox { padding: 18px; }
.rank { display: grid; gap: 4px; }
.rank button { display: grid; grid-template-columns: 22px minmax(0, 130px) minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 0; background: none; padding: 7px 6px; border-radius: 8px; text-align: left; font-size: 14px; }
.rank button:hover, .rank button.sel { background: var(--blue-050); }
.rank .pos { font-family: var(--f-display); font-weight: 900; color: var(--ink-3); font-size: 13px; text-align: center; }
.rank .nm { color: var(--navy); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .track { height: 10px; background: var(--blue-050); border-radius: 0 4px 4px 0; overflow: hidden; }
.rank .fill { height: 100%; background: var(--blue); border-radius: 0 4px 4px 0; }
.rank .val { font-size: 13px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.detail { padding: 18px 20px; margin-top: 14px; display: grid; gap: 10px; }
.detail .days { display: flex; flex-wrap: wrap; gap: 6px; }
th.sortable { cursor: pointer; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
th.n { text-align: right; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--blue-050); }

/* Reporte */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
.kpi { padding: 16px 18px; display: flex; gap: 14px; align-items: center; }
.kpi b { font-family: var(--f-display); font-weight: 900; font-size: 30px; line-height: 1; color: var(--navy); }
.kpi span { font-size: 14px; color: var(--ink-2); line-height: 1.3; }
.kpi .sq.ok { background: var(--ok-bg); color: var(--ok); } .kpi .sq.warn { background: var(--warn-bg); color: var(--warn); } .kpi .sq.bad { background: var(--bad-bg); color: var(--bad); } .kpi .sq.mute { background: var(--blue-050); color: var(--ink-3); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.toolbar select { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }

/* Formularios */
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; color: var(--navy); }
.field input, .field select, .field textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px rgba(0,168,168,.2); }
.hint { font-size: 13px; color: var(--ink-3); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 8px; padding: 12px 20px; font-weight: 600; background: var(--blue); color: #fff; }
.btn:hover { background: var(--navy); }
.btn.teal { background: var(--teal); } .btn.teal:hover { background: var(--teal-700); }
.btn.ghost { background: #fff; color: var(--blue); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--blue-200); background: var(--blue-050); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.compose { display: grid; gap: 14px; padding: 20px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }

/* Login */
.login { min-height: 100vh; display: grid; grid-template-columns: 1.15fr 1fr; background: var(--bg); }
.login-hero { padding: 48px clamp(16px, 5vw, 72px); display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.login-hero img { width: 230px; height: 230px; object-fit: contain; margin-left: -12px; }
.login-hero h1 { font-size: clamp(34px, 4.6vw, 52px); line-height: 1.1; letter-spacing: -.02em; max-width: 14ch; }
.login-hero p { margin: 0; color: var(--ink-2); font-size: 17px; max-width: 44ch; }
.login-side { background: #fff; border-left: 3px solid var(--teal); display: grid; place-items: center; padding: 48px 16px; }
.login-side form { width: 100%; max-width: 360px; display: grid; gap: 18px; }

/* Pie */
.foot-site { border-top: 1px solid var(--line); }
.foot-site .wrap { display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding-block: 18px; font-size: 14px; color: var(--ink-2); }
.foot-site b { color: var(--navy); font-family: var(--f-display); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; box-shadow: 0 8px 24px rgba(31,63,99,.25); z-index: 50; max-width: calc(100% - 32px); border-left: 4px solid var(--teal); }

@media (max-width: 960px) {
  .grid-rep { grid-template-columns: minmax(0, 1fr); }
  .search { flex-basis: 100%; order: 4; }
  .grid-home { grid-template-columns: minmax(0, 1fr); }
  .login { grid-template-columns: 1fr; }
  .login-side { border-left: 0; border-top: 3px solid var(--teal); }
  .login-hero img { width: 170px; height: 170px; }
  .tag { display: none; }
}
@media (max-width: 640px) {
  .pass { grid-template-columns: 1fr; }
  .stub { border-right: 0; border-bottom: 2px dashed var(--blue-200); }
  .pass-body { padding: 20px 14px; }
  .clock { font-size: 34px; }
  .me-txt { display: none; }
  .row2 { grid-template-columns: 1fr; }
  .leg .lbl { display: none; }
  .leg .real { font-size: 17px; }
  .leg .dot { width: 40px; height: 40px; }
  .week { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .brand span { font-size: 18px; }
  .brand img { width: 52px; height: 52px; }
  .top .wrap { gap: 8px 12px; padding-block: 8px; }
  .tabs { order: 3; flex-basis: 100%; }
  .rank button { grid-template-columns: 20px minmax(0, 100px) minmax(0, 1fr) auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const fmt = min => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
const realMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const nowMin = () => S.horaSim ?? realMin();
const todayIdx = () => { const g = new Date().getDay(); return g === 0 ? -1 : g - 1; };

const person = id => PEOPLE.find(p => p.id === id);
const me = () => person(ROLES[S.role].persona);
const turnoHoy = id => { const i = todayIdx(); return i < 0 ? 'D' : S.malla[id][i]; };

const PASOS = [
  { k: 'entrada', code: 'ENT', lbl: 'Entrada', plan: 'ini', ico: 'in', btn: 'Marcar entrada' },
  { k: 'salidaAlm', code: 'ALM', lbl: 'Salida a almuerzo', plan: 'almIni', ico: 'lunch', btn: 'Salir a almorzar' },
  { k: 'regresoAlm', code: 'REG', lbl: 'Regreso de almuerzo', plan: 'almFin', ico: 'back', btn: 'Marcar regreso' },
  { k: 'salida', code: 'SAL', lbl: 'Salida', plan: 'fin', ico: 'out', btn: 'Marcar salida' }
];
const pasosDe = t => PASOS.filter(p => TURNOS[t][p.plan]);

function evaluar(paso, real, t, m) {
  const tu = TURNOS[t];
  if (paso === 'entrada') { const d = real - toMin(tu.ini); return d > 5 ? ['warn', `Tarde ${d} min`] : ['ok', 'A tiempo']; }
  if (paso === 'salidaAlm') return ['mute', 'Registrado'];
  if (paso === 'regresoAlm') {
    const dur = real - (m.salidaAlm ?? real), perm = toMin(tu.almFin) - toMin(tu.almIni);
    return dur > perm + 5 ? ['warn', `Almuerzo ${dur} min`] : ['ok', `Almuerzo ${dur} min`];
  }
  const d = real - toMin(tu.fin);
  if (d < 0) return ['warn', `Salió ${-d} min antes`];
  if (d > 30) return ['info', `${d} min extra`];
  return ['ok', 'A tiempo'];
}

function marcasDe(id) {
  if (id === me().id) return S.marcas[id] || {};
  const src = S.otros[id] || {}, out = {}, n = nowMin();
  for (const k in src) { const v = toMin(src[k]); if (v <= n) out[k] = v; }
  return out;
}

function estadoDia(id) {
  const t = turnoHoy(id), tu = TURNOS[t];
  if (!tu.ini) return { cls: 'mute', txt: tu.nombre };
  const m = marcasDe(id), n = nowMin();
  if (m.entrada == null) {
    if (n < toMin(tu.ini)) return { cls: 'mute', txt: 'Aún no inicia' };
    if (n > toMin(tu.ini) + 15) return { cls: 'bad', txt: 'Sin marcar entrada' };
    return { cls: 'info', txt: 'Por llegar' };
  }
  let cls = 'ok', txt = 'Al día';
  for (const p of pasosDe(t)) {
    if (m[p.k] == null) continue;
    const [c, tx] = evaluar(p.k, m[p.k], t, m);
    if (c === 'warn') { cls = 'warn'; txt = tx; }
  }
  return { cls, txt };
}

const norm = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const match = (txt, q) => norm(txt).includes(norm(q.trim()));
function mk(txt, q) {
  if (!q || !q.trim()) return esc(txt);
  const n = norm(txt), k = norm(q.trim()), i = n.indexOf(k);
  if (i < 0) return esc(txt);
  return esc(txt.slice(0, i)) + '<mark>' + esc(txt.slice(i, i + k.length)) + '</mark>' + esc(txt.slice(i + k.length));
}
function resultados(q) {

  const com = S.comunicados.filter(c => match(`${c.titulo} ${c.cuerpo} ${c.de} ${c.para}`, q)).slice(0, 5);
  const per = PEOPLE.filter(p => match(`${p.nombre} ${p.area} ${p.sede}`, q)).slice(0, 5);

  if (!com.length && !per.length && !her.length) return `<div class="empty">Nada coincide con "${esc(q)}".</div>`;

  if (com.length) h += '<h4>Comunicados</h4>' + com.map(c => `<button type="button" class="r" data-goto="com:${c.id}"><span class="sq">${ico('mega')}</span><span><b>${mk(c.titulo, q)}</b><small>${esc(c.de)} · ${esc(c.fecha)}</small></span></button>`).join('');
  if (per.length) h += '<h4>Personas</h4>' + per.map(p => `<button type="button" class="r" data-goto="per:${p.id}"><span class="avatar soft" style="width:34px;height:34px;font-size:11px">${initials(p.nombre)}</span><span><b>${mk(p.nombre, q)}</b><small>${esc(p.area)} · ${esc(p.sede)} · ver en la malla</small></span></button>`).join('');
  if (her.length) h += '<h4>Herramientas</h4>' + her.map(t => `<a class="r" href="${t.url}" target="_blank" rel="noopener"><span class="sq">${ico(t.i)}</span><span><b>${mk(t.n, q)}</b><small>${esc(t.f)}</small></span></a>`).join('');
  return h;
}

/* ── Informes mensuales (datos simulados con semilla fija) ── */
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const PROP = { 1: .10, 2: .04, 3: .32, 4: .06, 5: .03, 6: .21, 7: .09, 8: .03, 9: .14, 10: .05, 11: .26 };
function rng(seed) { let t = seed >>> 0; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
function mesesDisponibles() {
  const d = new Date(), out = [];
  for (let i = 0; i < 6; i++) { const m = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(`${m.getFullYear()}-${m.getMonth()}`); }
  return out;
}
function registrosMes(y, m) {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const ult = new Date(y, m + 1, 0).getDate(), regs = [], dias = [];
  for (let d = 1; d <= ult; d++) {
    const f = new Date(y, m, d); if (f >= hoy) break;
    const dow = f.getDay(); if (dow === 0) continue;
    dias.push(d);
    for (const p of PEOPLE) {
      const t = S.malla[p.id][dow - 1], tu = TURNOS[t]; if (!tu.ini) continue;
      const r = rng(y * 10000 + m * 400 + d * 13 + p.id * 7919);
      const aus = r() < .015, tarde = r() < PROP[p.id];
      const entOff = tarde ? 6 + Math.floor(r() * r() * 48) : -12 + Math.floor(r() * 16);
      let alm = null;
      if (tu.almIni) { const perm = toMin(tu.almFin) - toMin(tu.almIni); alm = { perm, dur: perm + (r() < .08 ? 8 + Math.floor(r() * 25) : -5 + Math.floor(r() * 9)) }; }
      const q = r(), salOff = q < .05 ? -(5 + Math.floor(r() * 30)) : q < .17 ? 31 + Math.floor(r() * 90) : Math.floor(r() * 20);
      regs.push({ pid: p.id, d, aus, entOff, alm, salOff });
    }
  }
  return { regs, dias };
}
function informe() {
  const [y, m] = S.mes.split('-').map(Number), r = ROLES[S.role];
  const sede = r.sede || S.repSede;
  const gente = PEOPLE.filter(p => (sede === 'Todas' || p.sede === sede) && (S.repArea === 'Todas' || p.area === S.repArea));
  const ids = new Set(gente.map(p => p.id));
  const { regs, dias } = registrosMes(y, m);
  const st = Object.fromEntries(gente.map(p => [p.id, { p, prog: 0, dias: 0, tardes: 0, minT: 0, almL: 0, temp: 0, extra: 0, aus: 0, detalle: [] }]));
  const porDia = Object.fromEntries(dias.map(d => [d, []]));
  for (const g of regs) {
    if (!ids.has(g.pid)) continue;
    const s = st[g.pid]; s.prog++;
    if (g.aus) { s.aus++; s.detalle.push({ d: g.d, txt: 'Sin marcar', cls: 'bad' }); continue; }
    s.dias++;
    if (g.entOff > 5) { s.tardes++; s.minT += g.entOff; porDia[g.d].push({ n: s.p.nombre, min: g.entOff }); s.detalle.push({ d: g.d, txt: `Tarde ${g.entOff} min`, cls: 'warn' }); }
    if (g.alm && g.alm.dur > g.alm.perm + 5) { s.almL++; s.detalle.push({ d: g.d, txt: `Almuerzo ${g.alm.dur} min`, cls: 'warn' }); }
    if (g.salOff < 0) { s.temp++; s.detalle.push({ d: g.d, txt: `Salió ${-g.salOff} min antes`, cls: 'warn' }); }
    if (g.salOff > 30) s.extra += g.salOff;
  }
  const lista = Object.values(st);
  const tot = k => lista.reduce((a, s) => a + s[k], 0);
  return { y, m, dias, lista, porDia, tot, sede };
}
function chartDias(info) {
  const W = 720, H = 220, L = 30, R = 8, T = 12, B = 26, iw = W - L - R, ih = H - T - B;
  const ds = info.dias, n = ds.length || 1, bw = iw / n;
  const vals = ds.map(d => info.porDia[d].length), max = Math.max(4, ...vals);
  const paso = max <= 6 ? 1 : max <= 12 ? 2 : 5, top = Math.ceil(max / paso) * paso;
  const y = v => T + ih - (v / top) * ih;
  let g = '<g class="grid">';
  for (let v = 0; v <= top; v += paso) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  g += '</g>';
  const bars = ds.map((d, i) => {
    const v = vals[i], x = L + i * bw, w = Math.max(2, bw - 2), h = ih * v / top, yy = T + ih - h;
    const path = v ? `M${x + 1},${T + ih} V${yy + Math.min(4, h)} Q${x + 1},${yy} ${x + 1 + Math.min(4, w / 2)},${yy} H${x + 1 + w - Math.min(4, w / 2)} Q${x + 1 + w},${yy} ${x + 1 + w},${yy + Math.min(4, h)} V${T + ih} Z` : '';
    const f = new Date(info.y, info.m, d), lbl = f.getDay() === 1 || i === 0;
    return `<g data-dia="${d}"><rect class="hit" x="${x}" y="${T}" width="${bw}" height="${ih}"/>${v ? `<path class="bar" d="${path}"/>` : ''}${lbl ? `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${d}</text>` : ''}</g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Llegadas tarde por día del mes">${g}<line x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}" stroke="var(--blue-200)"/>${bars}</svg>`;
}
function informesView() {
  const r = ROLES[S.role];
  if (!S.mes) { const ms = mesesDisponibles(); S.mes = ms[new Date().getDate() <= 5 ? 1 : 0]; }
  const info = informe(), L = info.lista;
  const dias = info.tot('dias'), tardes = info.tot('tardes');
  const punt = dias ? Math.round((1 - tardes / dias) * 1000) / 10 : 0;
  const nombreMes = `${MESES[info.m]} ${info.y}`;
  const opt = (arr, v, f = a => a) => arr.map(a => `<option value="${a}" ${a === v ? 'selected' : ''}>${f(a)}</option>`).join('');
  const filtrosRep = `<div class="filters">
    <div class="field"><label for="rMes">Mes</label><select id="rMes">${opt(mesesDisponibles(), S.mes, k => { const [y, m] = k.split('-'); return `${MESES[m][0].toUpperCase() + MESES[m].slice(1)} ${y}`; })}</select></div>
    ${r.sede ? `<div class="field"><label>Sede</label><select disabled><option>${r.sede}</option></select></div>` : `<div class="field"><label for="rSede">Sede</label><select id="rSede">${opt(['Todas', 'Bogotá', 'Santo Domingo'], S.repSede)}</select></div>`}
    <div class="field"><label for="rArea">Área</label><select id="rArea">${opt(['Todas', ...AREAS], S.repArea)}</select></div>
    <span style="flex:1"></span><button class="btn ghost" type="button" data-tool="excel">${ico('file')} Exportar a Excel</button></div>`;
  if (!info.dias.length) return `<div class="hello"><div><div class="eyebrow">Intranet · informes</div><h1>Asistencia de <em>${nombreMes}</em></h1></div></div>${filtrosRep}
    <div class="card" style="padding:24px;color:var(--ink-2)">Este mes todavía no tiene días cerrados. Elige el mes anterior para ver el informe completo.</div>`;
  const kpi = (cls, val, l, sub, i) => `<div class="card kpi"><span class="sq ${cls}">${ico(i)}</span><div><b class="num">${val}</b><span>${l}</span>${sub ? `<small>${sub}</small>` : ''}</div></div>`;
  const rk = L.filter(s => s.tardes).sort((a, b) => b.minT - a.minT || b.tardes - a.tardes).slice(0, 8);
  const maxR = rk.length ? rk[0].minT : 1;
  const sel = L.find(s => s.p.id === S.repSel);
  const pc = s => s.dias ? Math.round((1 - s.tardes / s.dias) * 100) : 0;
  const pcCls = v => v >= 95 ? 'ok' : v >= 85 ? 'warn' : 'bad';
  const sortKeys = { minT: 'Minutos tarde', tardes: 'Llegadas tarde', almL: 'Almuerzos largos', temp: 'Salidas antes', extra: 'Horas extra', aus: 'Sin marcar', punt: 'Puntualidad' };
  const ordenada = L.slice().sort((a, b) => S.repSort === 'punt' ? pc(a) - pc(b) : b[S.repSort] - a[S.repSort]);
  const h = m => `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`;
  const th = (k, l) => `<th class="n sortable" data-sort="${k}" aria-sort="${S.repSort === k ? 'descending' : 'none'}">${l}${S.repSort === k ? ' ↓' : ''}</th>`;
  const rows = ordenada.map(s => `<tr class="clickable ${S.repSel === s.p.id ? 'hl' : ''}" data-sel="${s.p.id}"><td>${personCell(s.p)}</td>
    <td class="n">${s.dias}</td><td class="n">${s.tardes}</td><td class="n">${s.minT}</td><td class="n">${s.tardes ? Math.round(s.minT / s.tardes) : 0}</td>
    <td class="n">${s.almL}</td><td class="n">${s.temp}</td><td class="n">${h(s.extra)}</td><td class="n">${s.aus}</td>
    <td class="n"><span class="chip ${pcCls(pc(s))}">${pc(s)} %</span></td></tr>`).join('');
  return `<div class="hello"><div><div class="eyebrow">Intranet · informes de asistencia</div><h1>Asistencia de <em>${nombreMes}</em></h1>
    <p>${info.sede === 'Todas' ? 'Las dos sedes' : `Sede ${info.sede}`}${S.repArea !== 'Todas' ? ` · ${S.repArea}` : ''}, comparado con la malla de cada día. ${info.dias.length} días laborales cerrados.</p></div></div>
    ${filtrosRep}
    <div class="kpis six">
      ${kpi(pcCls(punt), `${punt} %`, 'Puntualidad del equipo', `${dias} jornadas marcadas`, 'check')}
      ${kpi('warn', tardes, 'Llegadas tarde', `${info.tot('minT')} min de retraso en total`, 'clock')}
      ${kpi('warn', info.tot('almL'), 'Almuerzos largos', 'Más de 5 min sobre lo permitido', 'lunch')}
      ${kpi('warn', info.tot('temp'), 'Salidas antes de hora', '', 'out')}
      ${kpi('bad', info.tot('aus'), 'Jornadas sin marcar', 'Programadas en la malla', 'x')}
      ${kpi('mute', h(info.tot('extra')), 'Horas extra', 'Salidas 30 min o más después', 'moon')}
    </div>
    <div class="grid-rep">
      <section class="card chartbox"><h3>Llegadas tarde por día</h3><div class="sub">Pasa el cursor sobre un día para ver quién llegó tarde.</div>
        <div class="chart" id="chartDias">${chartDias(info)}</div><div class="tip" id="tip" hidden></div></section>
      <section class="card rankbox"><h3>¿Quién llegó más tarde?</h3><div class="sub">Minutos de retraso acumulados en el mes. Toca un nombre para ver el detalle.</div>
        <div class="rank">${rk.length ? rk.map((s, i) => `<button type="button" data-sel="${s.p.id}" class="${S.repSel === s.p.id ? 'sel' : ''}"><span class="pos">${i + 1}</span><span class="nm">${s.p.nombre}</span>
          <span class="track"><span class="fill" style="display:block;width:${Math.max(3, s.minT / maxR * 100)}%"></span></span><span class="val">${s.minT} min · ${s.tardes} ${s.tardes === 1 ? 'vez' : 'veces'}</span></button>`).join('')
          : '<p class="hint">Nadie llegó tarde este mes.</p>'}</div></section>
    </div>
    ${sel ? `<section class="card detail"><div class="sec-h" style="margin:0"><h3 style="font-size:18px">${sel.p.nombre} · ${nombreMes}</h3><button type="button" class="link" data-sel="0">Cerrar detalle</button></div>
      <div class="hint">${sel.dias} jornadas · ${sel.tardes} llegadas tarde · ${sel.almL} almuerzos largos · ${sel.temp} salidas antes · ${sel.aus} sin marcar</div>
      <div class="days">${sel.detalle.length ? sel.detalle.sort((a, b) => a.d - b.d).map(x => `<span class="chip ${x.cls}">${new Date(info.y, info.m, x.d).toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric' })} · ${x.txt}</span>`).join('') : '<span class="chip ok">Sin novedades en el mes</span>'}</div></section>` : ''}
    <section style="margin-top:28px"><div class="sec-h"><h2>Detalle por persona</h2><span class="hint">Toca una columna para ordenar · toca una fila para ver sus días</span></div>
      <div class="card tablewrap"><table><thead><tr><th>Persona</th><th class="n">Jornadas</th>${th('tardes', 'Llegadas tarde')}${th('minT', 'Min. tarde')}<th class="n">Promedio</th>${th('almL', 'Almuerzos largos')}${th('temp', 'Salidas antes')}${th('extra', 'Horas extra')}${th('aus', 'Sin marcar')}${th('punt', 'Puntualidad')}</tr></thead><tbody>${rows}</tbody></table></div></section>
    <p class="hint" style="margin-top:14px">Prototipo: los meses anteriores se simulan con la malla de esta semana. En la versión real salen de las marcas guardadas.</p>`;
}

/* ── Eventos ── */
let toastTimer;
function toast(msg, rerender = true) {
  if (rerender) render();
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2600);
}

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'loginForm') { S.logged = true; render(); return; }
  if (e.target.id === 'compose') {
    const tit = document.getElementById('cTit').value.trim(), txt = document.getElementById('cTxt').value.trim();
    if (!tit || !txt) { toast('Escribe un título y un mensaje para publicar.', false); return; }
    const p = me();
    S.comunicados.unshift({ id: Date.now(), de: p.nombre, cargo: ROLES[S.role].rol, fecha: 'Ahora', para: document.getElementById('cPara').value,
      pin: document.getElementById('cPin').checked, req: document.getElementById('cReq').checked, titulo: tit, cuerpo: txt, leidos: [p.id], imgs: S.draft.splice(0) });
    toast('Comunicado publicado. El equipo lo verá en su inicio.');
  }
});

document.addEventListener('click', e => {
  const qr = document.getElementById('qres');
  if (qr && !e.target.closest('.search')) qr.hidden = true;
  const t = e.target.closest('button, tr[data-sel], th[data-sort]'); if (!t) return;
  if (t.dataset.goto) {
    const [k, id] = t.dataset.goto.split(':');
    S.q = ''; S.hl = null; S.hlPer = null;
    if (k === 'com') { S.view = 'comunicados'; S.qc = ''; S.hl = +id; }
    else { S.view = 'malla'; S.filtroArea = 'Todas'; S.filtroSede = 'Todas'; S.hlPer = +id; }
    render();
    document.getElementById(`${k}-${id}`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }
  if (t.dataset.lb) { const [c, i] = t.dataset.lb.split(':'); S.lb = { cid: +c, i: +i }; render(); return; }
  if (t.dataset.lbclose) { S.lb = null; render(); return; }
  if (t.dataset.lbmove) { const n = S.comunicados.find(x => x.id === S.lb.cid).imgs.length; S.lb.i = (S.lb.i + +t.dataset.lbmove + n) % n; render(); return; }
  if (t.dataset.quitar) { S.draft.splice(+t.dataset.quitar, 1); document.getElementById('draftThumbs').innerHTML = draftThumbs(); return; }
  if (t.dataset.sel !== undefined) { const v = +t.dataset.sel; S.repSel = v && S.repSel !== v ? v : null; render(); return; }
  if (t.dataset.sort) { S.repSort = t.dataset.sort; render(); return; }
  if (t.dataset.tool === 'drive') { toast('En la versión real abre el archivo en la carpeta Intranet / Comunicados del Drive.', false); return; }
  if (t.dataset.role) { S.role = t.dataset.role; render(); return; }
  if (t.dataset.view) { S.view = t.dataset.view; S.hl = null; S.hlPer = null; render(); window.scrollTo(0, 0); return; }
  if (t.id === 'markBtn') {
    const p = me(), m = S.marcas[p.id] = S.marcas[p.id] || {};
    const sig = pasosDe(turnoHoy(p.id)).find(x => m[x.k] == null); if (!sig) return;
    m[sig.k] = nowMin();
    toast(`${sig.lbl} registrada a las ${fmt(m[sig.k])}.`); return;
  }
  if (t.dataset.leer) { const c = S.comunicados.find(x => x.id == t.dataset.leer); if (!c.leidos.includes(me().id)) c.leidos.push(me().id); toast('Lectura confirmada.'); return; }
  if (t.dataset.tool === '+') { toast('En la versión real se abre el formulario para agregar una herramienta.', false); return; }
  if (t.dataset.tool === 'excel') { toast('En la versión real descarga el reporte en Excel para nómina.', false); return; }
  if (t.dataset.tool) toast(`Aquí se abrirá ${t.dataset.tool} cuando tengamos el enlace de la app en AppSheet.`, false);
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'hSim' && el.value) { S.horaSim = toMin(el.value); render(); return; }
  if (el.id === 'fArea') { S.filtroArea = el.value; render(); return; }
  if (el.id === 'rMes') { S.mes = el.value; S.repSel = null; render(); return; }
  if (el.id === 'rSede') { S.repSede = el.value; S.repSel = null; render(); return; }
  if (el.id === 'rArea') { S.repArea = el.value; S.repSel = null; render(); return; }
  if (el.id === 'cImg') {
    const files = [...el.files].filter(f => f.type.startsWith('image/'));
    files.forEach(f => { const fr = new FileReader(); fr.onload = () => { S.draft.push({ nombre: f.name, src: fr.result }); const d = document.getElementById('draftThumbs'); if (d) d.innerHTML = draftThumbs(); }; fr.readAsDataURL(f); });
    el.value = ''; return;
  }
  if (el.id === 'fSede') { S.filtroSede = el.value; render(); return; }
  if (el.matches('input.tturno')) {
    const t = TURNOS[el.dataset.k], f = el.dataset.f, v = el.value.trim();
    if (!v || v === t[f]) { render(); return; }
    const antes = t[f]; t[f] = v;
    S.historial.push({ t: `${DIAS[todayIdx()] || 'Dom'} ${fmt(nowMin())}`, quien: me().nombre, txt: `el turno ${el.dataset.k} · ${f === 'nombre' ? 'nombre' : PASOS.find(x => x.plan === f).lbl.toLowerCase()}: ${antes} → ${v}` });
    toast('Turno actualizado. La malla y la asistencia ya usan el nuevo horario.');
    return;
  }
  if (el.matches('select.shift')) {
    const id = +el.dataset.p, d = +el.dataset.d, antes = S.malla[id][d];
    S.malla[id][d] = el.value;
    S.historial.push({ t: `${DIAS[todayIdx()] || 'Dom'} ${fmt(nowMin())}`, quien: me().nombre, txt: `${person(id).nombre} · ${DIAS[d]}: ${TURNOS[antes].nombre} → ${TURNOS[el.value].nombre}` });
    toast('Turno actualizado. La asistencia ya usa el nuevo horario.');
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { S.q = el.value; const r = document.getElementById('qres'); r.innerHTML = resultados(S.q); r.hidden = !S.q.trim(); }
  if (el.id === 'qc') { S.qc = el.value; document.getElementById('newsList').innerHTML = newsList(); }
});
document.addEventListener('focusin', e => {
  if (e.target.id === 'q' && S.q.trim()) { const r = document.getElementById('qres'); r.innerHTML = resultados(S.q); r.hidden = false; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.lb) { S.lb = null; render(); } const r = document.getElementById('qres'); if (r) r.hidden = true; }
  if (S.lb && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { const n = S.comunicados.find(x => x.id === S.lb.cid).imgs.length; S.lb.i = (S.lb.i + (e.key === 'ArrowRight' ? 1 : -1) + n) % n; render(); }
});
document.addEventListener('mousemove', e => {
  const tip = document.getElementById('tip'); if (!tip) return;
  const g = e.target.closest && e.target.closest('#chartDias g[data-dia]');
  document.querySelectorAll('#chartDias g.on').forEach(x => x !== g && x.classList.remove('on'));
  if (!g) { tip.hidden = true; return; }
  g.classList.add('on');
  const info = informe(), d = +g.dataset.dia, lst = info.porDia[d] || [];
  const f = new Date(info.y, info.m, d).toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
  tip.innerHTML = `<b>${f}</b><br>${lst.length ? `${lst.length} ${lst.length === 1 ? 'llegada tarde' : 'llegadas tarde'}<br>` + lst.sort((a, b) => b.min - a.min).map(x => `${esc(x.n)} · ${x.min} min`).join('<br>') : 'Nadie llegó tarde'}`;
  tip.hidden = false;
  const box = g.closest('.chartbox').getBoundingClientRect();
  let x = e.clientX - box.left + 14, y = e.clientY - box.top + 14;
  if (x + 240 > box.width) x = e.clientX - box.left - 250;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});

setInterval(() => {
  const c = document.getElementById('clock'); if (!c) return;
  c.innerHTML = `${fmt(nowMin())}<small>:${String(new Date().getSeconds()).padStart(2, '0')}</small>`;
}, 1000);

if (realMin() < 7 * 60 || realMin() >= 20 * 60) S.horaSim = 10 * 60 + 15;
S.comunicados.forEach(c => {
  if (c.imgs === 'TARIFA') c.imgs = [{ nombre: 'tarifario-riviera-maya.png', src: tablaImg() }];
  if (c.imgs === 'FAM') c.imgs = [
    { nombre: 'famtrip-punta-cana.jpg', src: poster('Famtrip Punta Cana', '14 al 17 de noviembre · 4 cupos', '#3b6ca7', '#00a8a8', 'WAKANDA TRAVEL') },
    { nombre: 'itinerario-famtrip.jpg', src: poster('Itinerario', 'Bávaro · Saona · Cap Cana', '#1f3f63', '#3b6ca7', 'DÍA A DÍA') }];
});
render();
</script>
