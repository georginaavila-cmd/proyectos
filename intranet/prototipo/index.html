<title>Intranet Wakanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Lato:wght@400;700;900&display=swap">
<style>
/* Mismo lenguaje visual que KAM 360 y Wakanda Documentos: fondo azul muy claro, barra blanca con logo y filete turquesa,
   titulares Lato 900 azul noche con palabra en turquesa, tarjetas blancas con ícono en cuadro turquesa suave. Solo tema claro, por marca. */
:root {
  color-scheme: light;
  --navy: #1f3f63; --blue: #3b6ca7; --blue-100: #e8eef6; --blue-050: #f4f7fb; --blue-200: #c3d3e6;
  --teal: #00a8a8; --teal-700: #008b8b; --teal-100: #d9f2f2; --teal-050: #eefafa;
  --pink: #ecb2c0; --pink-100: #fbeef1; --sand: #e7e38a; --sand-100: #faf9e4;
  --bg: #f2f6fb; --card: #ffffff;
  --ink: #222222; --ink-2: #555f6d; --ink-3: #8a94a3;
  --line: #e3e9f1;
  --ok: #1e8f52; --ok-bg: #eafaf1; --warn: #b26a00; --warn-bg: #fdf3e3; --bad: #c0392b; --bad-bg: #fdeceb; --info: #2f7fbf; --info-bg: #eaf4fc;
  --shadow: 0 4px 12px rgba(59,108,167,.10);
  --f-display: "Lato", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Jost", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; color: var(--navy); font-weight: 900; }
h1 em, h2 em { font-style: normal; color: var(--teal-700); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(0,168,168,.35); border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--teal-700); }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }

/* Barra de prototipo */
.proto { background: var(--sand-100); border-bottom: 1px solid #ecebc4; font-size: 13px; color: var(--ink-2); }
.proto .wrap { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; padding-block: 6px; }
.proto input[type=time] { border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; background: #fff; font-size: 13px; }
.seg { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: none; padding: 2px 12px; border-radius: 999px; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--blue-100); color: var(--blue); font-weight: 600; }

/* Barra superior */
.top { background: #fff; border-bottom: 3px solid var(--teal); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 72px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 40px; height: 40px; }
.brand span { font-family: var(--f-display); font-weight: 900; font-size: 20px; color: var(--navy); white-space: nowrap; }
.tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; padding-block: 4px; }
.tabs button { border: 0; background: none; padding: 8px 14px; border-radius: 999px; color: var(--ink-2); font-weight: 500; white-space: nowrap; font-size: 15px; }
.tabs button:hover { color: var(--navy); }
.tabs button[aria-current="page"] { background: var(--blue-100); color: var(--blue); font-weight: 600; }
.tag { font-family: var(--f-display); font-size: 11px; letter-spacing: .2em; font-weight: 700; color: var(--ink-2); text-transform: uppercase; }
.me { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; font-family: var(--f-display); font-weight: 900; font-size: 13px; flex: none; }
.avatar.soft { background: var(--teal-050); color: var(--navy); }
.me-txt { line-height: 1.25; text-align: right; }
.me-txt b { color: var(--navy); }
.me-txt span { color: var(--ink-3); font-size: 12px; }

main { padding-block: 40px 64px; }
.hello { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 32px; }
.hello h1 { font-size: clamp(32px, 4.4vw, 46px); line-height: 1.12; letter-spacing: -.02em; margin-top: 10px; }
.hello p { margin: 12px 0 0; color: var(--ink-2); font-size: 17px; max-width: 62ch; }
.grid-home { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.col { display: grid; gap: 28px; min-width: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.sec-h h2 { font-size: 24px; }
.link { border: 0; background: none; padding: 0; font-family: var(--f-display); font-weight: 700; color: var(--blue); font-size: 15px; }
.link:hover { color: var(--teal-700); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }

/* Pase de jornada */
.pass { display: grid; grid-template-columns: 240px minmax(0, 1fr); position: relative; overflow: hidden; box-shadow: var(--shadow); }
.stub { background: var(--blue-050); padding: 24px 22px 24px 28px; position: relative; display: flex; flex-direction: column; gap: 14px; border-right: 2px dashed var(--blue-200); }
.stub::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--teal); }
.stub .who { font-family: var(--f-display); font-weight: 900; font-size: 21px; line-height: 1.2; color: var(--navy); }
.stub dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
.stub dt { color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; padding-top: 2px; font-family: var(--f-display); font-weight: 700; }
.stub dd { margin: 0; font-weight: 600; color: var(--navy); }
.clock { font-family: var(--f-display); font-weight: 900; font-size: 42px; letter-spacing: -.02em; line-height: 1; margin-top: auto; color: var(--navy); }
.clock small { font-size: 17px; color: var(--teal-700); margin-left: 2px; }
.pass-body { padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.legs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); position: relative; }
.legs::before { content: ""; position: absolute; left: 12%; right: 12%; top: 21px; border-top: 2px dashed var(--blue-200); }
.leg { display: grid; justify-items: center; gap: 3px; text-align: center; position: relative; padding-inline: 4px; align-content: start; }
.leg .dot { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); color: var(--ink-3); position: relative; z-index: 1; }
.leg.done .dot { background: var(--teal); border-color: var(--teal); color: #fff; }
.leg.next .dot { background: var(--teal-050); border-color: var(--teal); color: var(--teal-700); box-shadow: 0 0 0 4px var(--teal-100); }
.leg .code { font-family: var(--f-display); font-weight: 900; letter-spacing: .12em; font-size: 12px; margin-top: 6px; color: var(--navy); }
.leg .lbl { font-size: 13px; color: var(--ink-2); line-height: 1.3; }
.leg .real { font-family: var(--f-display); font-weight: 900; font-size: 22px; line-height: 1.15; color: var(--navy); margin-top: 4px; }
.leg .plan { font-size: 12px; color: var(--ink-3); }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip .ico { width: 14px; height: 14px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.info { background: var(--info-bg); color: var(--info); }
.chip.mute { background: var(--blue-050); color: var(--ink-2); border: 1px solid var(--line); }
.action { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.mark-btn { font-family: var(--f-display); font-weight: 900; font-size: 17px; padding: 14px 26px; border-radius: 10px; background: var(--teal); color: #fff; border: 0; display: inline-flex; gap: 10px; align-items: center; box-shadow: 0 6px 16px rgba(0,168,168,.25); transition: transform .12s ease, background .12s; }
.mark-btn:hover { background: var(--teal-700); transform: translateY(-1px); }
.where { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.where .ico { color: var(--teal-700); width: 16px; height: 16px; }

/* Herramientas, igual que las tarjetas de Wakanda Documentos */
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
.tool { text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 22px 22px 16px; display: flex; flex-direction: column; gap: 10px; transition: box-shadow .2s, border-color .2s; }
.tool:hover { box-shadow: var(--shadow); border-color: var(--blue-200); }
.sq { width: 46px; height: 46px; border-radius: 8px; display: grid; place-items: center; background: var(--teal-050); color: var(--teal-700); flex: none; }
.tool h3 { font-size: 20px; margin-top: 8px; }
.tool p { margin: 0; font-size: 15px; color: var(--ink-2); line-height: 1.5; flex: 1; }
.tool .foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 8px; font-size: 14px; color: var(--ink-2); }
.tool .foot .ico { width: 18px; height: 18px; color: var(--blue); }
.tool.add { border-style: dashed; background: transparent; }
.tool.add .sq { background: #fff; border: 1px dashed var(--blue-200); color: var(--blue); }

/* Comunicados */
.news { display: grid; gap: 12px; }
.note { padding: 16px 18px; display: grid; gap: 6px; }
.note.pin { border-left: 4px solid var(--pink); }
.note-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); }
.note h3 { font-size: 17px; }
.note p { margin: 0; font-size: 15px; color: var(--ink-2); }
.note-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.bar { height: 6px; border-radius: 999px; background: var(--blue-100); overflow: hidden; flex: 1; min-width: 80px; }
.bar span { display: block; height: 100%; background: var(--teal); }

/* Semana */
.week { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 14px; }
.day { border-radius: 8px; padding: 8px 2px; text-align: center; display: grid; gap: 4px; font-size: 12px; justify-items: center; }
.day b { font-family: var(--f-display); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.day.today { background: var(--blue-050); outline: 1px solid var(--blue-200); }
.day.today b { color: var(--blue); }

/* Turnos */
.t-M { background: var(--blue-100); color: var(--blue); }
.t-T { background: var(--teal-100); color: var(--teal-700); }
.t-S { background: var(--sand-100); color: #7d7100; }
.t-D { background: #f3f5f8; color: var(--ink-3); }
.t-V { background: var(--pink-100); color: #b04a66; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }

/* Tablas */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; white-space: nowrap; }
thead th { font-family: var(--f-display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; background: #fafcfe; }
th.today, td.today { background: var(--blue-050); }
th.today { color: var(--blue); }
tbody tr:last-child td { border-bottom: 0; }
.person { display: flex; gap: 10px; align-items: center; }
.person .avatar { width: 32px; height: 32px; font-size: 11px; }
.person b { color: var(--navy); font-weight: 600; }
.person small { display: block; color: var(--ink-3); font-size: 12px; }
.shift { border: 0; border-radius: 8px; padding: 6px 4px; font-weight: 600; font-size: 13px; width: 100%; min-width: 96px; text-align: center; display: inline-flex; justify-content: center; }
select.shift { appearance: none; -webkit-appearance: none; cursor: pointer; text-align-last: center; }
select.shift:hover { box-shadow: inset 0 0 0 2px var(--blue-200); }
.log { display: grid; gap: 8px; font-size: 14px; padding: 16px 18px; }
.log div { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.log time { color: var(--teal-700); font-size: 13px; font-weight: 600; min-width: 72px; }

/* Reporte */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
.kpi { padding: 16px 18px; display: flex; gap: 14px; align-items: center; }
.kpi b { font-family: var(--f-display); font-weight: 900; font-size: 30px; line-height: 1; color: var(--navy); }
.kpi span { font-size: 14px; color: var(--ink-2); line-height: 1.3; }
.kpi .sq.ok { background: var(--ok-bg); color: var(--ok); } .kpi .sq.warn { background: var(--warn-bg); color: var(--warn); } .kpi .sq.bad { background: var(--bad-bg); color: var(--bad); } .kpi .sq.mute { background: var(--blue-050); color: var(--ink-3); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.toolbar select { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }

/* Formularios */
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; color: var(--navy); }
.field input, .field select, .field textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px rgba(0,168,168,.2); }
.hint { font-size: 13px; color: var(--ink-3); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 8px; padding: 12px 20px; font-weight: 600; background: var(--blue); color: #fff; }
.btn:hover { background: var(--navy); }
.btn.teal { background: var(--teal); } .btn.teal:hover { background: var(--teal-700); }
.btn.ghost { background: #fff; color: var(--blue); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--blue-200); background: var(--blue-050); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.compose { display: grid; gap: 14px; padding: 20px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }

/* Login */
.login { min-height: 100vh; display: grid; grid-template-columns: 1.15fr 1fr; background: var(--bg); }
.login-hero { padding: 48px clamp(16px, 5vw, 72px); display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.login-hero img { width: 150px; height: 150px; }
.login-hero h1 { font-size: clamp(34px, 4.6vw, 52px); line-height: 1.1; letter-spacing: -.02em; max-width: 14ch; }
.login-hero p { margin: 0; color: var(--ink-2); font-size: 17px; max-width: 44ch; }
.login-side { background: #fff; border-left: 3px solid var(--teal); display: grid; place-items: center; padding: 48px 16px; }
.login-side form { width: 100%; max-width: 360px; display: grid; gap: 18px; }

/* Pie */
.foot-site { border-top: 1px solid var(--line); }
.foot-site .wrap { display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding-block: 18px; font-size: 14px; color: var(--ink-2); }
.foot-site b { color: var(--navy); font-family: var(--f-display); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; box-shadow: 0 8px 24px rgba(31,63,99,.25); z-index: 50; max-width: calc(100% - 32px); border-left: 4px solid var(--teal); }

@media (max-width: 960px) {
  .grid-home { grid-template-columns: minmax(0, 1fr); }
  .login { grid-template-columns: 1fr; }
  .login-side { border-left: 0; border-top: 3px solid var(--teal); }
  .login-hero img { width: 110px; height: 110px; }
  .tag { display: none; }
}
@media (max-width: 640px) {
  .pass { grid-template-columns: 1fr; }
  .stub { border-right: 0; border-bottom: 2px dashed var(--blue-200); }
  .pass-body { padding: 20px 14px; }
  .clock { font-size: 34px; }
  .me-txt { display: none; }
  .row2 { grid-template-columns: 1fr; }
  .leg .lbl { display: none; }
  .leg .real { font-size: 17px; }
  .leg .dot { width: 40px; height: 40px; }
  .week { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .brand span { font-size: 17px; }
  .top .wrap { gap: 8px 12px; padding-block: 8px; }
  .tabs { order: 3; flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

/* ── Tiempo ── */
const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const fmt = min => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
const realMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const nowMin = () => S.horaSim ?? realMin();
const todayIdx = () => { const g = new Date().getDay(); return g === 0 ? -1 : g - 1; };
const initials = n => n.split(' ').map(w => w[0]).slice(0, 2).join('');
const person = id => PEOPLE.find(p => p.id === id);
const me = () => person(ROLES[S.role].persona);
const turnoHoy = id => { const i = todayIdx(); return i < 0 ? 'D' : S.malla[id][i]; };

const PASOS = [
  { k: 'entrada', code: 'ENT', lbl: 'Entrada', plan: 'ini', ico: 'in', btn: 'Marcar entrada' },
  { k: 'salidaAlm', code: 'ALM', lbl: 'Salida a almuerzo', plan: 'almIni', ico: 'lunch', btn: 'Salir a almorzar' },
  { k: 'regresoAlm', code: 'REG', lbl: 'Regreso de almuerzo', plan: 'almFin', ico: 'back', btn: 'Marcar regreso' },
  { k: 'salida', code: 'SAL', lbl: 'Salida', plan: 'fin', ico: 'out', btn: 'Marcar salida' }
];
const pasosDe = t => PASOS.filter(p => TURNOS[t][p.plan]);

function evaluar(paso, real, t, m) {
  const tu = TURNOS[t];
  if (paso === 'entrada') { const d = real - toMin(tu.ini); return d > 5 ? ['warn', `Tarde ${d} min`] : ['ok', 'A tiempo']; }
  if (paso === 'salidaAlm') return ['mute', 'Registrado'];
  if (paso === 'regresoAlm') {
    const dur = real - (m.salidaAlm ?? real), perm = toMin(tu.almFin) - toMin(tu.almIni);
    return dur > perm + 5 ? ['warn', `Almuerzo ${dur} min`] : ['ok', `Almuerzo ${dur} min`];
  }
  const d = real - toMin(tu.fin);
  if (d < 0) return ['warn', `Salió ${-d} min antes`];
  if (d > 30) return ['info', `${d} min extra`];
  return ['ok', 'A tiempo'];
}

function marcasDe(id) {
  if (id === me().id) return S.marcas[id] || {};
  const src = S.otros[id] || {}, out = {}, n = nowMin();
  for (const k in src) { const v = toMin(src[k]); if (v <= n) out[k] = v; }
  return out;
}

function estadoDia(id) {
  const t = turnoHoy(id), tu = TURNOS[t];
  if (!tu.ini) return { cls: 'mute', txt: tu.nombre };
  const m = marcasDe(id), n = nowMin();
  if (m.entrada == null) {
    if (n < toMin(tu.ini)) return { cls: 'mute', txt: 'Aún no inicia' };
    if (n > toMin(tu.ini) + 15) return { cls: 'bad', txt: 'Sin marcar entrada' };
    return { cls: 'info', txt: 'Por llegar' };
  }
  let cls = 'ok', txt = 'Al día';
  for (const p of pasosDe(t)) {
    if (m[p.k] == null) continue;
    const [c, tx] = evaluar(p.k, m[p.k], t, m);
    if (c === 'warn') { cls = 'warn'; txt = tx; }
  }
  return { cls, txt };
}

/* ── Vistas ── */
function render() {
  document.getElementById('app').innerHTML = S.logged ? protoBar() + appShell() : loginView();
}

function protoBar() {
  const b = (k, l) => `<button type="button" data-role="${k}" aria-pressed="${S.role === k}">${l}</button>`;
  return `<div class="proto"><div class="wrap">
    <span><b>Prototipo</b> · personas y datos de ejemplo · validación de IP apagada</span>
    <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label for="hSim">Hora</label>
      <input type="time" id="hSim" value="${fmt(nowMin())}"> Ver como
      <span class="seg">${b('colaborador', 'Colaborador')}${b('lider', 'Líder')}${b('gerencia', 'Gerencia')}</span></span>
  </div></div>`;
}

function loginView() {
  return `<div class="login">
    <section class="login-hero">
      <img src="${LOGO}" alt="Wakanda Travel">
      <div class="eyebrow">Intranet Wakanda Travel</div>
      <h1>Tu jornada empieza <em>aquí</em></h1>
      <p>Marca tu horario, abre tus herramientas y entérate de lo que pasa en la agencia, todo en un solo lugar.</p>
    </section>
    <section class="login-side">
      <form id="loginForm" novalidate>
        <div><div class="eyebrow">Iniciar sesión</div>
          <h2 style="font-size:28px;margin-top:8px">Hola de <em>nuevo</em></h2></div>
        <div class="field"><label for="u">Usuario</label>
          <input id="u" type="email" autocomplete="username" value="valentina.rios@wakandatravel.com.co"></div>
        <div class="field"><label for="pw">Contraseña</label>
          <input id="pw" type="password" autocomplete="current-password" value="contrasena"></div>
        <button class="btn teal" type="submit">${ico('in')} Entrar</button>
        <p class="hint" style="margin:0">¿Olvidaste tu contraseña? La administradora la restablece desde el panel.<br>En este prototipo cualquier contraseña funciona.</p>
      </form>
    </section>
  </div>`;
}

function appShell() {
  const p = me(), r = ROLES[S.role];
  const tabs = [['inicio', 'Inicio'], ['malla', 'Malla de horarios'], ['comunicados', 'Comunicados']];
  if (S.role !== 'colaborador') tabs.push(['asistencia', 'Asistencia']);
  if (!tabs.find(t => t[0] === S.view)) S.view = 'inicio';
  const views = { inicio: inicioView, malla: mallaView, comunicados: comunicadosView, asistencia: asistenciaView };
  return `<header class="top"><div class="wrap">
      <div class="brand"><img src="${LOGO}" alt=""><span>Wakanda Travel</span></div>
      <nav class="tabs" aria-label="Secciones">${tabs.map(([k, l]) =>
        `<button type="button" data-view="${k}" ${S.view === k ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav>
      <span class="tag">Intranet</span>
      <div class="me"><div class="me-txt"><b>${p.nombre}</b><br><span>${r.rol} · ${p.sede}</span></div><div class="avatar">${initials(p.nombre)}</div></div>
    </div></header>
    <main class="wrap">${views[S.view]()}</main>
    <footer class="foot-site"><div class="wrap"><span><b>Wakanda Travel</b> — Diseñadores de viajes, diseñadores de sueños</span><span>Intranet · RNT 101438</span></div></footer>`;
}

const fechaLarga = () => new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });

function inicioView() {
  const p = me(), h = Math.floor(nowMin() / 60);
  const saludo = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  return `<div class="hello"><div>
      <div class="eyebrow">Intranet · ${fechaLarga()}</div>
      <h1>${saludo}, <em>${p.nombre.split(' ')[0]}</em></h1>
      <p>${p.area} · Sede ${p.sede}. Marca tu jornada y abre tus herramientas desde aquí.</p></div></div>
    <div class="grid-home">
      <div class="col">${passView()}
        <section><div class="sec-h"><h2>Herramientas</h2><span class="hint">Se abren en una pestaña nueva</span></div>${toolsView()}</section></div>
      <div class="col">${newsSection(true)}${weekSection()}</div>
    </div>`;
}

function passView() {
  const p = me(), t = turnoHoy(p.id), tu = TURNOS[t], m = S.marcas[p.id] || {};
  const d = new Date(), [hh, mm] = fmt(nowMin()).split(':');
  const stub = `<div class="stub">
      <div class="eyebrow">Pase de jornada</div>
      <div class="who">${p.nombre}</div>
      <dl><dt>Turno</dt><dd>${tu.nombre}</dd>${tu.ini ? `<dt>Horario</dt><dd class="num">${tu.ini}–${tu.fin}</dd>` : ''}
        <dt>Sede</dt><dd>${p.sede}</dd>
        <dt>Fecha</dt><dd class="num">${d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' })}</dd></dl>
      <div class="clock num" id="clock">${hh}:${mm}<small>:${String(d.getSeconds()).padStart(2, '0')}</small></div>
    </div>`;
  if (!tu.ini) {
    return `<section class="card pass" aria-label="Pase de jornada">${stub}<div class="pass-body">
      <div><span class="chip mute">${tu.nombre}</span></div>
      <h2 style="font-size:24px">Hoy no tienes jornada <em>programada</em></h2>
      <p style="margin:0;color:var(--ink-2)">Así está en la malla de horarios publicada por tu líder. Si es un error, avísale para que la corrija.</p>
    </div></section>`;
  }
  const pasos = pasosDe(t), sig = pasos.find(x => m[x.k] == null);
  const legs = pasos.map(x => {
    const real = m[x.k];
    const [c, tx] = real != null ? evaluar(x.k, real, t, m) : [];
    return `<div class="leg ${real != null ? 'done' : x === sig ? 'next' : ''}">
      <div class="dot">${ico(real != null ? 'check' : x.ico)}</div>
      <div class="code">${x.code}</div><div class="lbl">${x.lbl}</div>
      <div class="real num">${real != null ? fmt(real) : '—'}</div>
      <div class="plan num">Programado ${tu[x.plan]}</div>
      ${real != null ? `<span class="chip ${c}">${tx}</span>` : ''}</div>`;
  }).join('');
  const action = sig
    ? `<button class="mark-btn" type="button" id="markBtn">${ico(sig.ico)} ${sig.btn}</button>`
    : `<span class="chip ok" style="font-size:14px;padding:6px 14px">${ico('check')} Jornada completa</span>`;
  return `<section class="card pass" aria-label="Pase de jornada">${stub}<div class="pass-body">
      <div class="legs">${legs}</div>
      <div class="action">${action}<div class="where">${ico('shield')} Oficina ${p.sede} · equipo autorizado</div></div>
    </div></section>`;
}

function toolsView() {
  const tools = [
    { n: 'OMNIAXIS', d: 'Descripción por confirmar.', i: 'compass', f: 'Enlace pendiente' },
    { n: 'Wakanda Documentos', d: 'Cotizaciones, confirmaciones, vouchers e itinerarios con el diseño de Wakanda.', i: 'file', f: 'Documentos de viaje' },
    { n: 'KAM 360', d: 'Visitas, prospectos y solicitudes a Operaciones del equipo comercial.', i: 'target', f: 'Equipo comercial' }
  ];
  return `<div class="tools">${tools.map(t => `<button type="button" class="tool" data-tool="${t.n}">
      <span class="sq">${ico(t.i)}</span><h3>${t.n}</h3><p>${t.d}</p>
      <span class="foot"><span>${t.f}</span>${ico('chev')}</span></button>`).join('')}
    ${S.role === 'gerencia' ? `<button type="button" class="tool add" data-tool="+"><span class="sq">${ico('plus')}</span><h3>Agregar herramienta</h3><p>Nombre, ícono, enlace y quién la puede ver.</p><span class="foot"><span>Solo administración</span>${ico('chev')}</span></button>` : ''}
  </div>`;
}

function noteView(c, compact) {
  const yo = me().id, leido = c.leidos.includes(yo), total = PEOPLE.length, pct = Math.round(c.leidos.length / total * 100);
  let foot = '';
  if (S.role === 'gerencia' && c.req) {
    foot = `<div class="note-foot"><span class="hint num">Leído por ${c.leidos.length} de ${total}</span><div class="bar"><span style="width:${pct}%"></span></div></div>`;
  } else if (c.req) {
    foot = `<div class="note-foot">${leido ? `<span class="chip ok">${ico('check')} Leído</span>`
      : `<span class="chip warn">Requiere confirmación</span><button type="button" class="btn sm teal" data-leer="${c.id}">Confirmar lectura</button>`}</div>`;
  }
  return `<article class="card note ${c.pin ? 'pin' : ''}">
    <div class="note-meta">${c.pin ? `<span class="chip info">${ico('pin')} Fijado</span>` : ''}<span>${c.de} · ${c.cargo}</span><span>·</span><span>${c.fecha}</span></div>
    <h3>${c.titulo}</h3>${compact ? '' : `<p>${c.cuerpo}</p><div class="hint">Para: ${c.para}</div>`}${foot}</article>`;
}

function newsSection(compact) {
  const list = compact ? S.comunicados.slice(0, 3) : S.comunicados;
  return `<section><div class="sec-h"><h2>Comunicados</h2>${compact ? `<button type="button" class="link" data-view="comunicados">Ver todos</button>` : ''}</div>
    <div class="news">${list.map(c => noteView(c, compact)).join('')}</div></section>`;
}

function weekSection() {
  const p = me(), hoy = todayIdx();
  return `<section><div class="sec-h"><h2>Tu semana</h2><button type="button" class="link" data-view="malla">Ver malla</button></div>
    <div class="card week">${DIAS.map((d, i) => { const t = S.malla[p.id][i], tu = TURNOS[t];
      return `<div class="day ${i === hoy ? 'today' : ''}"><b>${d}</b><span class="chip t-${t}">${tu.nombre}</span>
        <span class="num hint" style="font-size:12px">${tu.ini ? `${tu.ini}–${tu.fin}` : '—'}</span></div>`; }).join('')}</div></section>`;
}

function filtros() {
  const opt = (arr, v) => arr.map(a => `<option ${a === v ? 'selected' : ''}>${a}</option>`).join('');
  return `<span style="display:flex;gap:8px;flex-wrap:wrap">
    <select id="fArea" aria-label="Área">${opt(['Todas', ...AREAS], S.filtroArea)}</select>
    <select id="fSede" aria-label="Sede">${opt(['Todas', 'Bogotá', 'Santo Domingo'], S.filtroSede)}</select></span>`;
}
const filtrados = () => PEOPLE.filter(p => (S.filtroArea === 'Todas' || p.area === S.filtroArea) && (S.filtroSede === 'Todas' || p.sede === S.filtroSede));
const personCell = p => `<div class="person"><div class="avatar soft">${initials(p.nombre)}</div><div><b>${p.nombre}</b><small>${p.area} · ${p.sede}</small></div></div>`;

function mallaView() {
  const r = ROLES[S.role], hoy = todayIdx();
  const editHint = S.role === 'colaborador' ? 'La malla es pública: todo el equipo la ve. Solo tu líder y gerencia pueden cambiarla.'
    : S.role === 'lider' ? 'Puedes cambiar los turnos de Operaciones / Reservas. Cada cambio recalcula la asistencia al instante.'
    : 'Puedes cambiar cualquier turno. Cada cambio recalcula la asistencia al instante.';
  const rows = filtrados().map(p => {
    const ed = r.puedeEditar(p);
    return `<tr><td>${personCell(p)}</td>${DIAS.map((d, i) => { const t = S.malla[p.id][i];
      return `<td class="${i === hoy ? 'today' : ''}">${ed
        ? `<select class="shift t-${t}" data-p="${p.id}" data-d="${i}" aria-label="Turno de ${p.nombre} el ${d}">${Object.keys(TURNOS).map(k => `<option value="${k}" ${k === t ? 'selected' : ''}>${TURNOS[k].nombre}</option>`).join('')}</select>`
        : `<span class="shift t-${t}">${TURNOS[t].nombre}</span>`}</td>`; }).join('')}</tr>`;
  }).join('');
  return `<div class="hello"><div><div class="eyebrow">Intranet · semana actual</div><h1>Malla de <em>horarios</em></h1><p>${editHint}</p></div></div>
    <div class="toolbar"><div class="legend">${Object.entries(TURNOS).map(([k, t]) => `<span class="chip t-${k}">${t.nombre}${t.ini ? ` · ${t.ini}–${t.fin}` : ''}</span>`).join('')}</div>${filtros()}</div>
    <div class="card tablewrap"><table><thead><tr><th>Persona</th>${DIAS.map((d, i) => `<th class="${i === hoy ? 'today' : ''}">${d}${i === hoy ? ' · hoy' : ''}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    <section style="margin-top:32px"><div class="sec-h"><h2>Historial de cambios</h2></div>
      <div class="card log">${S.historial.slice().reverse().map(h => `<div><time>${h.t}</time><span><b>${h.quien}</b> cambió ${h.txt}</span></div>`).join('')}</div></section>`;
}

function comunicadosView() {
  const puede = S.role !== 'colaborador';
  const compose = puede ? `<section><div class="sec-h"><h2>Nuevo comunicado</h2></div>
    <form class="card compose" id="compose">
      <div class="field"><label for="cTit">Título</label><input id="cTit" placeholder="Ej.: Cierre de mes de facturación"></div>
      <div class="field"><label for="cTxt">Mensaje</label><textarea id="cTxt" rows="4" placeholder="Escribe el comunicado"></textarea></div>
      <div class="row2"><div class="field"><label for="cPara">Para</label><select id="cPara">${['Todo el equipo', ...AREAS, 'Sede Bogotá', 'Sede Santo Domingo'].map(a => `<option>${a}</option>`).join('')}</select></div>
        <div class="field" style="align-content:end;gap:10px">
          <label class="check"><input type="checkbox" id="cReq" checked> Pedir confirmación de lectura</label>
          <label class="check"><input type="checkbox" id="cPin"> Fijar en el inicio</label></div></div>
      <div><button class="btn" type="submit">${ico('mega')} Publicar</button></div>
    </form></section>`
    : `<section><div class="sec-h"><h2>¿Cómo funciona?</h2></div><div class="card" style="padding:18px 20px;color:var(--ink-2)">Cuando un comunicado pide confirmación, toca <b>Confirmar lectura</b>. Gerencia ve quién ya lo leyó.</div></section>`;
  return `<div class="hello"><div><div class="eyebrow">Intranet · comunicación interna</div><h1>¿Qué hay de <em>nuevo</em>?</h1>
    <p>${S.role === 'gerencia' ? 'Publica para todo el equipo, un área o una sede, y mira quién ya leyó.' : 'Lo que la agencia necesita que sepas.'}</p></div></div>
    <div class="grid-home"><div class="col">${newsSection(false)}</div><div class="col">${compose}</div></div>`;
}

function asistenciaView() {
  const r = ROLES[S.role];
  const gente = filtrados().filter(p => S.role === 'gerencia' || r.puedeEditar(p));
  const est = gente.map(p => ({ p, e: estadoDia(p.id) }));
  const cnt = k => est.filter(x => x.e.cls === k).length;
  const cell = (id, paso) => {
    const t = turnoHoy(id), tu = TURNOS[t], m = marcasDe(id);
    if (!tu.ini || !tu[paso.plan]) return '<td class="hint">—</td>';
    const v = m[paso.k];
    if (v == null) return `<td><span class="hint num">${tu[paso.plan]}</span></td>`;
    const [c, tx] = evaluar(paso.k, v, t, m);
    return `<td><b class="num" style="color:var(--navy)">${fmt(v)}</b>${c === 'warn' || c === 'info' ? ` <span class="chip ${c}">${tx}</span>` : ''}</td>`;
  };
  const rows = est.map(({ p, e }) => { const t = turnoHoy(p.id), tu = TURNOS[t];
    return `<tr><td>${personCell(p)}</td>
      <td><span class="chip t-${t}">${tu.nombre}</span>${tu.ini ? `<div class="hint num">${tu.ini}–${tu.fin}</div>` : ''}</td>
      ${PASOS.map(x => cell(p.id, x)).join('')}<td><span class="chip ${e.cls}">${e.txt}</span></td></tr>`; }).join('');
  const kpi = (cls, n, l, i) => `<div class="card kpi"><span class="sq ${cls}">${ico(i)}</span><div><b class="num">${n}</b><br><span>${l}</span></div></div>`;
  return `<div class="hello"><div><div class="eyebrow">Intranet · ${fechaLarga()}</div><h1>¿Quién está <em>trabajando hoy?</em></h1>
    <p>${S.role === 'lider' ? 'Tu equipo de Operaciones / Reservas' : 'Todo el equipo'}, comparado con la malla vigente. Si cambias un turno, este reporte se recalcula.</p></div>
    <button class="btn ghost" type="button" data-tool="excel">${ico('file')} Exportar a Excel</button></div>
    <div class="kpis">${kpi('ok', cnt('ok'), 'Al día', 'check')}${kpi('warn', cnt('warn'), 'Con novedad', 'alert')}${kpi('bad', cnt('bad'), 'Sin marcar entrada', 'x')}${kpi('mute', cnt('mute') + cnt('info'), 'Descanso, vacaciones o por llegar', 'moon')}</div>
    <div class="toolbar"><span class="hint">Las horas en gris son lo programado; todavía no hay marca.</span>${S.role === 'gerencia' ? filtros() : ''}</div>
    <div class="card tablewrap"><table><thead><tr><th>Persona</th><th>Turno</th><th>Entrada</th><th>Sale a almorzar</th><th>Regresa</th><th>Salida</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ── Eventos ── */
let toastTimer;
function toast(msg, rerender = true) {
  if (rerender) render();
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2600);
}

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'loginForm') { S.logged = true; render(); return; }
  if (e.target.id === 'compose') {
    const tit = document.getElementById('cTit').value.trim(), txt = document.getElementById('cTxt').value.trim();
    if (!tit || !txt) { toast('Escribe un título y un mensaje para publicar.', false); return; }
    const p = me();
    S.comunicados.unshift({ id: Date.now(), de: p.nombre, cargo: ROLES[S.role].rol, fecha: 'Ahora', para: document.getElementById('cPara').value,
      pin: document.getElementById('cPin').checked, req: document.getElementById('cReq').checked, titulo: tit, cuerpo: txt, leidos: [p.id] });
    toast('Comunicado publicado. El equipo lo verá en su inicio.');
  }
});

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.role) { S.role = t.dataset.role; render(); return; }
  if (t.dataset.view) { S.view = t.dataset.view; render(); window.scrollTo(0, 0); return; }
  if (t.id === 'markBtn') {
    const p = me(), m = S.marcas[p.id] = S.marcas[p.id] || {};
    const sig = pasosDe(turnoHoy(p.id)).find(x => m[x.k] == null); if (!sig) return;
    m[sig.k] = nowMin();
    toast(`${sig.lbl} registrada a las ${fmt(m[sig.k])}.`); return;
  }
  if (t.dataset.leer) { const c = S.comunicados.find(x => x.id == t.dataset.leer); if (!c.leidos.includes(me().id)) c.leidos.push(me().id); toast('Lectura confirmada.'); return; }
  if (t.dataset.tool === '+') { toast('En la versión real se abre el formulario para agregar una herramienta.', false); return; }
  if (t.dataset.tool === 'excel') { toast('En la versión real descarga el reporte en Excel para nómina.', false); return; }
  if (t.dataset.tool) toast(`Aquí se abrirá ${t.dataset.tool} cuando tengamos su enlace.`, false);
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'hSim' && el.value) { S.horaSim = toMin(el.value); render(); return; }
  if (el.id === 'fArea') { S.filtroArea = el.value; render(); return; }
  if (el.id === 'fSede') { S.filtroSede = el.value; render(); return; }
  if (el.matches('select.shift')) {
    const id = +el.dataset.p, d = +el.dataset.d, antes = S.malla[id][d];
    S.malla[id][d] = el.value;
    S.historial.push({ t: `${DIAS[todayIdx()] || 'Dom'} ${fmt(nowMin())}`, quien: me().nombre, txt: `${person(id).nombre} · ${DIAS[d]}: ${TURNOS[antes].nombre} → ${TURNOS[el.value].nombre}` });
    toast('Turno actualizado. La asistencia ya usa el nuevo horario.');
  }
});

setInterval(() => {
  const c = document.getElementById('clock'); if (!c) return;
  c.innerHTML = `${fmt(nowMin())}<small>:${String(new Date().getSeconds()).padStart(2, '0')}</small>`;
}, 1000);

if (realMin() < 7 * 60 || realMin() >= 20 * 60) S.horaSim = 10 * 60 + 15;
render();
</script>
